<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#047857">
    <title>You're offline — Daily Language Quiz</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f8fafc; color: #0f172a; font: 16px/1.6 system-ui, sans-serif; }
      main { width: min(100%, 420px); padding: 32px; border: 1px solid #e2e8f0; border-radius: 24px; background: white; text-align: center; box-shadow: 0 8px 30px rgb(15 23 42 / 6%); }
      h1 { margin: 0 0 12px; font-size: 1.5rem; }
      p { margin: 0 0 24px; color: #475569; }
      a { display: inline-block; padding: 10px 18px; border-radius: 12px; background: #047857; color: white; font-weight: 600; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Connect to the internet and try again. Your daily quiz and answer submissions need a connection.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
