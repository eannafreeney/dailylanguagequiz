<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
      }
      body {
        font-family: system-ui, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        padding: 72px 72px 64px;
        display: flex;
        flex-direction: column;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .mark {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: #047857;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        font-weight: 700;
      }
      .name {
        font-size: 36px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .meta {
        margin-top: 48px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .practice {
        color: #64748b;
        font-size: 26px;
        font-weight: 500;
        display: flex;
        gap: 14px;
        align-items: center;
      }
      .level {
        background: #ecfdf5;
        color: #065f46;
        border-radius: 12px;
        padding: 4px 14px;
        font-size: 22px;
        font-weight: 700;
      }
      .count {
        font-size: 26px;
        font-weight: 650;
      }
      .track {
        margin-top: 18px;
        height: 14px;
        border-radius: 999px;
        background: #e2e8f0;
        overflow: hidden;
      }
      .bar {
        width: 20%;
        height: 100%;
        background: #10b981;
      }
      .card {
        margin-top: 36px;
        background: white;
        border: 2px solid #e2e8f0;
        border-radius: 36px;
        padding: 56px 52px 48px;
        box-shadow: 0 1px 2px rgb(15 23 42 / 0.06);
      }
      .kicker {
        margin: 0 0 22px;
        color: #c2410c;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 40px;
        font-size: 48px;
        line-height: 1.25;
        letter-spacing: -0.02em;
      }
      .option {
        display: flex;
        align-items: center;
        gap: 22px;
        border: 2px solid #e2e8f0;
        border-radius: 22px;
        padding: 26px 28px;
        margin-top: 16px;
      }
      .radio {
        width: 32px;
        height: 32px;
        border-radius: 999px;
        border: 3px solid #cbd5e1;
        flex: none;
      }
      .label {
        flex: 1;
        font-size: 30px;
        font-weight: 550;
        line-height: 1.3;
      }
      .letter {
        color: #94a3b8;
        font-size: 24px;
      }
      .foot {
        margin-top: auto;
        text-align: center;
      }
      .foot p {
        margin: 0;
        color: #64748b;
        font-size: 28px;
      }
      .url {
        margin-top: 10px !important;
        color: #047857;
        font-size: 36px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <div class="mark">D.</div>
      <div class="name">Daily Irish Quiz</div>
    </div>
    <div class="meta">
      <div class="practice">Daily practice<span class="level">A1</span></div>
      <div class="count">Question 1 of 5</div>
    </div>
    <div class="track"><div class="bar"></div></div>
    <section class="card">
      <p class="kicker">Complete the sentence</p>
      <h1 lang="ga">How do you say “Come in” in Irish?</h1>

      <div class="option">
        <span class="radio"></span>
        <span class="label">Téigh amach.</span>
        <span class="letter">A</span>
      </div>
      <div class="option">
        <span class="radio"></span>
        <span class="label">Suigh síos.</span>
        <span class="letter">B</span>
      </div>
      <div class="option">
        <span class="radio"></span>
        <span class="label">Tar isteach.</span>
        <span class="letter">C</span>
      </div>
    </section>
    <footer class="foot">
      <p>Four more questions today</p>
      <p class="url">dailyirishquiz.com</p>
    </footer>
  </body>
</html>
